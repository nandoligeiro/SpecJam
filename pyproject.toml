[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specjam"
version = "0.2.0"
description = "A harness-neutral engineering meta-harness built around flow graphs, incremental sessions and versioned skills."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fernando Costa" }]
license = "Apache-2.0"
keywords = ["agents", "engineering-workflow", "flow-graphs", "rws", "sqlite", "vector-memory", "cli"]
dependencies = []

[project.urls]
Homepage = "https://github.com/nandoligeiro/SpecJam"
Repository = "https://github.com/nandoligeiro/SpecJam"
Issues = "https://github.com/nandoligeiro/SpecJam/issues"

[project.scripts]
specjam = "specjam.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["specjam", "specjam.*"]
exclude = ["specjam.payload.__pycache__", "specjam.payload.__pycache__.*"]

[tool.setuptools.package-data]
"specjam.payload" = [
  "ignore-rules.txt",
  "bridge/*.md",
  "workspace/*.md",
  "workspace/*.json",
  "workspace/graphs/*.json",
  "workspace/references/*.md",
  "workspace/runtime/*.md",
  "workspace/skills/*/*.md",
  "workspace/skills/*/*.json",
  "workspace/skills/*/references/*.md",
]

[tool.setuptools.exclude-package-data]
"specjam.payload" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
